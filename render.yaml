# Blueprint do Render: cria automaticamente o backend (Web Service) e o
# frontend (Static Site), ambos no plano gratuito, cada um com o seu
# subdominio *.onrender.com - sem VPS e sem precisar de dominio proprio.

services:
  - type: web
    name: sala-virtual-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: sala-virtual
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sala-virtual-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
