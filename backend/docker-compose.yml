services:
  backend:
    build: ./backend
    container_name: sala-virtual-backend
    ports:
      - "4000:4000"
    environment:
      - PORT=4000
      - JWT_SECRET=troque-este-segredo-em-producao
      - DATABASE_URL=${DATABASE_URL}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: sala-virtual-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped
