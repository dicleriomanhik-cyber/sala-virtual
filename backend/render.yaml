# Blueprint do Render: cria automaticamente o backend (Web Service) e o
# frontend (Static Site), ambos no plano gratuito, cada um com o seu
# subdominio *.onrender.com - sem VPS e sem precisar de dominio proprio.
#
# NOTA: os nomes de servico abaixo (sala-virtual-queha-api / sala-virtual-queha)
# tem de corresponder aos nomes ATUAIS mostrados no painel do Render, senao o
# Render cria servicos duplicados em vez de atualizar os existentes.
# O link publico real do backend continua a ser sala-virtual-backend.onrender.com
# (o Render nao muda o link ao renomear, so o nome mostrado no painel).

services:
  - type: web
    name: sala-virtual-queha-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 4000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false

  - type: web
    name: sala-virtual-queha
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://sala-virtual-backend.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
